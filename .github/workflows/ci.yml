name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang lld qemu-system-x86 ovmf mtools dosfstools \
            grub-pc-bin grub-common xorriso

      - name: Install Rust nightly (build-std + rust-src)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          # src/rust/rust-toolchain.toml pins nightly + rust-src
          cd src/rust
          rustup show
          rustup component add rust-src
          rustup target add x86_64-unknown-none

      # test-uefi rebuilds via build_all_uefi (kernel + EFI + img), then runs
      # UEFI smoke, #PF dump, and GRUB ISO (+ Phase2 I/B/S/2 tags).
      - name: Build + UEFI/GRUB/#PF QEMU smoke
        run: ./scripts/core.sh test-uefi
